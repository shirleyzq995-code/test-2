    .blue-satellite { position: absolute; z-index: 2; left: var(--x, 50%); top: var(--y, 50%); display: grid; width: var(--size, 225px); height: var(--height, 126.56px); place-items: center; transform: translate3d(-50%, -50%, var(--depth, 0px)) scale(1); transform-style: preserve-3d; translate: 0 0; border: 1px solid rgba(104,185,255,.58); border-radius: 24px; background: linear-gradient(145deg, rgba(18,38,64,.96), rgba(4,8,16,.97)); box-shadow: 0 8px 34px rgba(0,0,0,.44), 0 0 28px rgba(42,132,255,.24), inset 0 0 22px rgba(62,147,255,.2); opacity: 0; filter: blur(9px); }

        <div class="nav-item active" aria-current="page"><span class="nav-icon">▤</span><span>服务包</span></div>

        <div class="nav-item"><span class="nav-icon">♧</span><span>选股</span></div>
        <div class="nav-item"><span class="nav-icon">▣</span><span>直播</span></div>
      </nav>
      <main class="main" aria-label="服务套餐">
        <section class="plans-grid" aria-label="套餐选项">
          <article class="service-card red" aria-label="正式版套餐" tabindex="0" role="button" aria-pressed="false">
            <div class="red-ambient" aria-hidden="true"></div>
            <div class="orbit-scene" aria-hidden="true">
              <div class="orbit-system">
                <span class="orbit-icon"></span><span class="orbit-icon"></span>
                <span class="orbit-icon"></span><span class="orbit-icon"></span>
                <span class="orbit-icon"></span><span class="orbit-icon"></span>
                <span class="orbit-icon"></span><span class="orbit-icon"></span>
              </div>
              <span class="orbit-center"></span>
            </div>
          </article>
          <article class="service-card blue" aria-label="排名版套餐" tabindex="0" role="button" aria-pressed="false">
            <div class="blue-aura" aria-hidden="true"></div>
            <div class="blue-scene" aria-hidden="true">
              <span class="blue-core"></span>
              <span class="blue-satellite"></span><span class="blue-satellite"></span>
              <span class="blue-satellite"></span><span class="blue-satellite"></span>
              <span class="blue-satellite"></span><span class="blue-satellite"></span>
              <span class="blue-satellite"></span><span class="blue-satellite"></span>
            </div>
          </article>
          <article class="service-card gold" aria-label="大师版套餐" tabindex="0" role="button" aria-pressed="false">
            <div class="gold-scene" aria-hidden="true">
              <div class="gold-tile-rows">
                <div class="gold-tile-row"><div class="gold-tile-track"></div></div>
                <div class="gold-tile-row"><div class="gold-tile-track"></div></div>
                <div class="gold-tile-row"><div class="gold-tile-track"></div></div>
              </div>
              <div class="gold-core"></div>
            </div>
          </article>
        </section>
        <section class="detail-panel" aria-label="服务包详细内容">
          <div class="detail-toolbar"><button class="detail-back" id="back-to-packages" type="button"><span aria-hidden="true">←</span>返回上一级</button></div>
          <div class="detail-tiles" aria-hidden="true">
            <div class="placeholder-card"><div class="placeholder-block"></div></div>
            <div class="placeholder-card"><div class="placeholder-block"></div></div>
            <div class="placeholder-card"><div class="placeholder-block"></div></div>
            <div class="placeholder-card"><div class="placeholder-block"></div></div>
            <div class="placeholder-card"><div class="placeholder-block"></div></div>
            <div class="placeholder-card"><div class="placeholder-block"></div></div>
            <div class="placeholder-card"><div class="placeholder-block"></div></div>
            <div class="placeholder-card"><div class="placeholder-block"></div></div>
          </div>
        </section>

    </div>
    <footer class="ticker">
      <span class="label">沪指</span><span>3811.9&nbsp; −30.29&nbsp; −0.79%</span>
      <span class="label">深指</span><span>12620.9&nbsp; −266.72&nbsp; −2.07%</span>
      <span>8709.44亿</span><span class="label">创业</span><span>3036.66&nbsp; −98.62&nbsp; −3.15%</span>
      <span>4252.72亿</span><span class="clock">2026-10-08 15:06:37</span>
    </footer>
  </div>
  <script>
    // Navigation and toolbar controls provide local visual feedback only.
    const navItems = [...document.querySelectorAll('.nav-item')];
    const clickableControls = [...document.querySelectorAll('.top-tab, .action')];
    const packageItems = [...document.querySelectorAll('.service-card')];
    const mainContent = document.querySelector('.main');
    const backButton = document.querySelector('#back-to-packages');
    const demoCard = document.querySelector('.service-card.red');
    const blueCard = document.querySelector('.service-card.blue');
    const blueSatellites = [...blueCard.querySelectorAll('.blue-satellite')];
    const goldCard = document.querySelector('.service-card.gold');
    const goldTileTracks = [...goldCard.querySelectorAll('.gold-tile-track')];
    goldTileTracks.forEach(track => {
      const sequence = document.createDocumentFragment();
      for (let index = 0; index < 7; index += 1) {
        const tile = document.createElement('span');
        tile.className = 'gold-tile';
        sequence.append(tile);
      }
      track.append(sequence);
      [...track.children].forEach(tile => track.append(tile.cloneNode()));
    });
    const orbitIcons = [...demoCard.querySelectorAll('.orbit-icon')];
    let orbitFrame = 0;
    let orbitStartedAt = 0;

    function stopOrbit() {
      if (orbitFrame) cancelAnimationFrame(orbitFrame);
      orbitFrame = 0;
      demoCard.classList.remove('orbit-active');
      orbitIcons.forEach(icon => {
        icon.style.opacity = '0';
        icon.style.filter = 'blur(7px)';
        icon.style.transform = 'translate3d(0, 0, -70px) scale(.62)';
      });
    }
    function orbitStep(now) {
      if (mainContent.classList.contains('detail-view') || (!demoCard.matches(':hover') && !demoCard.matches(':focus-visible'))) {
        stopOrbit();
        return;
      }
      const elapsed = now - orbitStartedAt;
      const turn = elapsed * (Math.PI * 2 / 26000);
      orbitIcons.forEach((icon, index) => {
        const reveal = Math.max(0, Math.min(1, (elapsed - index * 45) / 820));
        const spread = 1 - Math.pow(1 - reveal, 3);
        const angle = turn + index * (Math.PI * 2 / orbitIcons.length);
        const depth = Math.sin(angle);
        const front = (depth + 1) / 2;
        const x = Math.cos(angle) * 250 * spread;
        const y = depth * 220 * spread;
        const z = depth * 118 * spread - 75 * (1 - spread);
        const scale = (.58 + front * .54) * (.48 + spread * .52);
        icon.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, ${z.toFixed(1)}px) scale(${scale.toFixed(3)})`;
        icon.style.opacity = (spread * (.16 + front * .84)).toFixed(3);
        icon.style.filter = `blur(${(7 * (1 - spread) + (1 - front) * 4.5).toFixed(2)}px) brightness(${(.68 + front * .52).toFixed(2)})`;
      });
      orbitFrame = requestAnimationFrame(orbitStep);
    }
    function startOrbit() {
      if (mainContent.classList.contains('detail-view') || orbitFrame) return;
      demoCard.classList.add('orbit-active');
      orbitStartedAt = performance.now();
      orbitFrame = requestAnimationFrame(orbitStep);
    }
    demoCard.addEventListener('pointerenter', startOrbit);
    demoCard.addEventListener('pointerleave', stopOrbit);
    demoCard.addEventListener('focusin', startOrbit);
    demoCard.addEventListener('focusout', stopOrbit);

    function startBlueShowcase() {
      if (mainContent.classList.contains('detail-view') || blueCard.classList.contains('blue-card-active')) return;
      const layout = [
        { x: 22, y: 35, size: 200, depth: -72 }, { x: 50, y: 27, size: 230, depth: 44 },
        { x: 78, y: 37, size: 215, depth: -38 }, { x: 84, y: 56, size: 255, depth: 72 },
        { x: 73, y: 76, size: 220, depth: -56 }, { x: 48, y: 84, size: 245, depth: 62 },
        { x: 24, y: 74, size: 205, depth: -84 }, { x: 15, y: 53, size: 260, depth: 32 }
      ];
      blueSatellites.forEach((icon, index) => {
        const point = layout[index];
        icon.style.setProperty('--x', `${point.x}%`);
        icon.style.setProperty('--y', `${point.y}%`);
        icon.style.setProperty('--size', `${point.size}px`);
        icon.style.setProperty('--height', `${(point.size * 9 / 16).toFixed(2)}px`);
        icon.style.setProperty('--depth', `${point.depth}px`);
        icon.style.setProperty('--delay', `${(Math.random() * 1.3).toFixed(2)}s`);
        icon.style.setProperty('--duration', `${(4.4 + Math.random() * 3).toFixed(2)}s`);
        icon.style.setProperty('--drift', `${(Math.random() * 34 - 17).toFixed(0)}px`);
      });
      blueCard.classList.add('blue-card-active');
    }
    function stopBlueShowcase() { blueCard.classList.remove('blue-card-active'); }
    blueCard.addEventListener('pointerenter', startBlueShowcase);
    blueCard.addEventListener('pointerleave', stopBlueShowcase);
    blueCard.addEventListener('focusin', startBlueShowcase);
    blueCard.addEventListener('focusout', stopBlueShowcase);
    const startGoldRoll = () => goldCard.classList.add('gold-card-active');
    const stopGoldRoll = () => goldCard.classList.remove('gold-card-active');
    goldCard.addEventListener('pointerenter', startGoldRoll);
    goldCard.addEventListener('pointerleave', stopGoldRoll);
    goldCard.addEventListener('focusin', startGoldRoll);
    goldCard.addEventListener('focusout', stopGoldRoll);

    function activateNav(item) {
      navItems.forEach(entry => {
        entry.classList.toggle('active', entry === item);
        if (entry === item) entry.setAttribute('aria-current', 'page');
        else entry.removeAttribute('aria-current');
      });
    }
    function toggleControl(control) {
      control.classList.toggle('selected');
    }
    function addKeyboardActivation(elements, activate) {
      elements.forEach(element => element.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          activate(element);
        }
      }));
    }
    navItems.forEach(item => item.addEventListener('click', () => activateNav(item)));
    clickableControls.forEach(control => control.addEventListener('click', () => toggleControl(control)));
    addKeyboardActivation(navItems, activateNav);
    addKeyboardActivation(clickableControls, toggleControl);
    function selectPackage(item) {
      const enteringDetails = !mainContent.classList.contains('detail-view');
      if (enteringDetails) {
        if (mainContent.classList.contains('leaving')) return;
        stopOrbit();
        stopBlueShowcase();
        stopGoldRoll();
        mainContent.classList.add('leaving');
        packageItems.forEach(entry => {
          const selected = entry === item;
          entry.classList.toggle('selected', selected);
          entry.classList.toggle('leave-lead', entry === goldCard);
          entry.classList.toggle('leave-second', entry === blueCard);
          entry.classList.toggle('leave-third', entry === demoCard);
          entry.setAttribute('aria-pressed', String(selected));
        });
        window.setTimeout(() => {
          mainContent.classList.remove('leaving');
          packageItems.forEach(entry => entry.classList.remove('leave-lead', 'leave-second', 'leave-third'));
          mainContent.classList.add('detail-view', 'opening');
          window.setTimeout(() => mainContent.classList.remove('opening'), 450);
        }, 480);
        return;
      }
      packageItems.forEach(entry => {
        const selected = entry === item;
        entry.classList.toggle('selected', selected);
        entry.setAttribute('aria-pressed', String(selected));
      });
    }
    backButton.addEventListener('click', () => {
      mainContent.classList.remove('detail-view', 'opening');
      packageItems.forEach(item => {
        item.classList.remove('selected');
        item.setAttribute('aria-pressed', 'false');
      });
    });
    packageItems.forEach(item => {
      item.addEventListener('click', () => selectPackage(item));
      item.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          selectPackage(item);
        }
      });
    });
  </script>
</body>
